[project]
name = "kompas"
version = "0.1.0"
description = "Kompas signal pipeline and real-time API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "google-genai>=2.32.0",
  "httpx>=0.27",
  "openpyxl>=3.1.5",
  "pypdf>=6.21.1",
  "python-multipart>=0.0.32",
  "uvicorn>=0.30",
]

[project.scripts]
kompas = "kompas.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
